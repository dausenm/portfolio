<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dausen</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-white">
  <!-- Taskbar -->
  <div id="taskbar">
    <div class="taskbar-item" id="taskbar-terminal">
      <img src="assets/terminal-icon.png" alt="Terminal" />
    </div>
    <div class="taskbar-item">
      <a href="https://github.com/dausenm" target="_blank">
        <img src="assets/github.png" alt="GitHub" />
      </a>
    </div>
    <div class="taskbar-item">
      <a href="https://www.linkedin.com/in/dausenmason" target="_blank">
        <img src="assets/linkedin.png" alt="LinkedIn" />
      </a>
    </div>
  </div>

  <!-- Terminal Icon -->
  <div class="desktop-icon">
    <img id="terminal-icon" src="assets/terminal-icon.png" alt="Terminal Icon">
    <span class="icon-caption">Terminal</span>
  </div>

  <!-- GitHub Icon -->
  <div class="desktop-icon">
    <a href="https://github.com/dausenm" target="_blank">
        <img src="assets/github.png" alt="GitHub Icon">
    </a>
    <span class="icon-caption">GitHub</span>
  </div>

  <!-- LinkedIn Icon -->
  <div class="desktop-icon">
    <a href="https://www.linkedin.com/in/dausenmason" target="_blank">
        <img src="assets/linkedin.png" alt="LinkedIn Icon">
    </a>
    <span class="icon-caption">LinkedIn</span>
  </div>
  
  <!-- Terminal Element (Initially hidden) -->
  <div id="terminal" class="hidden">
    <!-- Terminal Header and Close Button -->
    <div id="terminal-header">
      <button id="close-button">X</button>
    </div>

    <!-- Terminal Output -->
    <div id="terminal-output"></div>

    <!-- Terminal Input -->
    <div id="terminal-input-container">
      <span id="terminal-input-prompt">user> </span>
      <input id="terminal-input" type="text" autofocus />
    </div>
</div>

<div id="resume-window" class="hidden">
  <!-- Draggable Header with Fullscreen Button and Close Button -->
  <div id="resume-header" style="padding: 1px; background-color: #222; cursor: move;">
      <button id="resume-close-button" style="float: right; background-color: red; color: white; border: none; border-radius: 50%; cursor: pointer; padding: 2px 5px; font-size: 14px;">X</button>
      <button id="fullscreen-button" style="float: right; background-color: green; color: white; border: none; cursor: pointer; padding: 2px 5px; font-size: 14px; margin-right: 5px;">⛶</button>
  </div>


  <script src="/terminal.js"></script> <!-- External JS for terminal logic -->

</body>
</html>
