<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dausen</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-white">
  <!-- Taskbar -->
  <div id="taskbar">
    <div class="start-button" id="start-button">
      <img src="assets/start-icon.png" alt="Start">
    </div>
    <div class="taskbar-item" id="taskbar-terminal">
      <img src="assets/terminal-icon.png" alt="Terminal" />
    </div>
    <div class="taskbar-item">
      <a href="https://github.com/dausenm" target="_blank">
        <img src="assets/github.png" alt="GitHub" />
      </a>
    </div>
    <div class="taskbar-item">
      <a href="https://www.linkedin.com/in/dausenmason" target="_blank">
        <img src="assets/linkedin.png" alt="LinkedIn" />
      </a>
    </div>
  </div>

  <!-- Start Menu (Initially Hidden) -->
  <div id="start-menu">
    <ul class="start-menu-list">
      <li id="projects-option">Projects</li>
      <li id="resume-option">Resume</li>
      <li><a href="#">Contact</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
  </div>

  <!-- Terminal Icon -->
  <div class="desktop-icon">
    <img id="terminal-icon" src="assets/terminal-icon.png" alt="Terminal Icon">
    <span class="icon-caption">Terminal</span>
  </div>
  
  <!-- Terminal Element (Initially hidden) -->
  <div id="terminal" class="hidden">
    <!-- Terminal Header and Close Button -->
    <div id="terminal-header">
      <button id="close-button">X</button>
    </div>

    <!-- Terminal Output -->
    <div id="terminal-output"></div>

    <!-- Terminal Input -->
    <div id="terminal-input-container">
      <span id="terminal-input-prompt">user> </span>
      <input id="terminal-input" type="text" autofocus />
    </div>
</div>

<div id="resume-window" class="hidden">
  <!-- Resume Header with Fullscreen and Close Buttons -->
  <div id="resume-header">
      <button id="resume-close-button">X</button>
      <button id="fullscreen-button">⛶</button>
  </div>

  <!-- Embed PDF -->
  <div id="resume-content">
    <iframe src="assets/resume.pdf" width="100%" height="100%"></iframe>
  </div>
</div>



  <script src="/terminal.js"></script> <!-- External JS for terminal logic -->

</body>
</html>
